name: OWASP ZAP Security Scan

on:
  workflow_dispatch:

jobs:
  zap-scan:
    name: OWASP ZAP Full Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: |
          mkdir -p reports
          chmod -R 777 reports

      - name: Start backend
        run: |
          nohup npm run backend > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:3000/api/health; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Start frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:5173; then
              echo "Frontend is ready"
              break
            fi
            echo "Waiting for frontend..."
            sleep 2
          done

      - name: Show application logs
        if: always()
        run: |
          echo "===== BACKEND LOG ====="
          cat backend.log || true

          echo "===== FRONTEND LOG ====="
          cat frontend.log || true

      - name: Run OWASP ZAP Full Scan
        run: |
          docker run --network host \
            -v "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://127.0.0.1:5173 \
            -r zap-report.html \
            -w zap-report.md \
            -J zap-report.json \
            -x zap-report.xml \
            -I

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-security-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs
          path: |
            backend.log
            frontend.log
          if-no-files-found: warn
          retention-days: 14